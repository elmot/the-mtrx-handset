# Nokia 8110 4G (nokia,argon) Sway / Sxmo configuration (240x320 portrait)

font "Sxmo 9"

# Keep display strictly in portrait (240x320 scale 1)
output SPI-1 scale 1 transform normal

# Left Softkey (Menu): open Sxmo appmenu (or global sys menu with Shift)
bindsym --locked Menu exec sxmo_dmenu.sh isopen && wtype -k Return || sxmo_appmenu.sh
bindsym --locked Shift+Menu exec sxmo_appmenu.sh sys

# Right Softkey (Escape): close menu / go back
bindsym --locked Escape exec sxmo_dmenu.sh isopen && sxmo_dmenu.sh close || wtype -k Escape

# Green Call button (remapped from KEY_PICKUP_PHONE to XF86Tools / F13):
# Answer incoming HFP call, or toggle earpiece/speaker during an active call, or open appmenu
bindsym --locked XF86Tools exec sh -c '\
	status="$(nokia-bt-hfp --ctl status 2>/dev/null || true)"; \
	case "$status" in \
		*"callsetup=1"*) nokia-bt-hfp --ctl answer ;; \
		*"call=1"*|*"bridge=1"*) \
			case "$status" in \
				*"output=earpiece"*) nokia-bt-hfp --ctl speaker ;; \
				*) nokia-bt-hfp --ctl earpiece ;; \
			esac ;; \
		*) sxmo_appmenu.sh ;; \
	esac'

# '*' key (KP_Multiply) and '#' key (XF86Launch5 / F14):
# Adjust audio / HFP call volume up and down
bindsym --locked KP_Multiply exec sxmo_audio.sh vol down
bindsym --locked XF86Launch5 exec sxmo_audio.sh vol up

# Keypad Slider (gpio-keys: SW_KEYPAD_SLIDE)
# Note: nokia-bt-hfp handles call answer/hangup and keypad backlight LED in C (<1 ms).
# Here in Sway:
# - Slide closed (keypad_slide:off): screen stays ON in 'lock' state (idles to screenoff after 10s)
# - Slide opened (keypad_slide:on): turn display on immediately via wlopm and transition to 'unlock'
bindswitch --locked keypad_slide:off exec sxmo_state.sh set lock
bindswitch --locked keypad_slide:on exec sh -c 'wlopm --on "*" >/dev/null 2>&1 & sxmo_state.sh set unlock'
